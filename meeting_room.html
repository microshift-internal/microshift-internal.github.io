<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣微轉會議室使用登記</title>
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --accent-color: #b00092;
            --bg-color: #f8f9fa;
            --card-bg: #fff;
            --text-color: #333;
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Segoe UI", Roboto, Arial, "Microsoft JhengHei", sans-serif;
            margin: 0;
            background: var(--bg-color);
            color: var(--text-color);
        }

        header {
            width: 100%;
            padding: 20px 0;
            margin-bottom: 30px;
            background: #fff;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .05);
            text-align: center;
        }

        .title { margin: 0; color: #222; font-size: 2.2rem; }
        .datetime { margin-top: 10px; color: var(--secondary-color); font-family: monospace; }
        .container { width: 95%; max-width: 1000px; margin: 0 auto; }
        .container.wide-mode { max-width: 1400px; }

        .announcement {
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 25px;
            background: #e7f3ff;
            border-left: 5px solid var(--primary-color);
            border-radius: 4px;
        }

        .tabs-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 12px 24px;
            border: 0;
            border-radius: 30px;
            background: #e0e0e0;
            color: #555;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
        }

        .tab-btn:hover { background: #d0d0d0; }
        .tab-btn.active { background: var(--primary-color); color: #fff; }
        .tab-btn:focus-visible, .btn-register:focus-visible {
            outline: 3px solid #005fcc;
            outline-offset: 3px;
        }

        .tab-content { display: none; width: 100%; }
        .tab-content.active { display: block; }

        .room-card {
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 12px;
            background: var(--card-bg);
            box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
            text-align: center;
        }

        .room-card ol {
            text-align: left;
        }

        .btn-register {
            display: inline-block;
            padding: 14px 24px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: var(--accent-color);
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        .calendar-wrapper {
            width: 100%;
            height: 550px;
            overflow: hidden;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        .calendar-wrapper iframe { width: 100%; height: 100%; border: 0; }
        .sample-img { max-width: 100%; height: auto; border-radius: 8px; }
        .all-rooms-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        footer { padding: 10px 0 40px; color: var(--secondary-color); text-align: center; font-size: .9rem; }

        @media (min-width: 768px) {
            .room-card { padding: 30px; }
            .calendar-wrapper { height: 650px; }
        }

        @media (min-width: 1200px) {
            .all-rooms-grid { grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 30px; }
        }

        @media (prefers-reduced-motion: no-preference) {
            .tab-content.active { animation: fadeIn .3s ease; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <header>
        <h1 class="title">會議室使用登記 📅</h1>
        <div class="datetime" id="currentDatetime" aria-live="polite"></div>
    </header>

    <main class="container" id="mainContainer">
        <div class="announcement">
            <strong>📝 使用提醒：</strong>本網站提供會議室預約狀況查詢；實際預約、修改及取消，皆需至 Google 行事曆操作。
        </div>

        <div class="tabs-container">
            <nav class="tabs-nav" id="tabsNav" role="tablist" aria-label="會議室分頁"></nav>
            <div id="tabPanels">
                <section id="info" class="tab-content active" role="tabpanel" aria-labelledby="tab-info">
                    <div class="room-card">
                        <h2>會議室預約說明</h2>
                        <ol>
                            <li>點選上方會議室分頁，查看該會議室目前的預約狀況。</li>
                            <li>行事曆中的內容僅供查看，無法直接在本頁完成預約。</li>
                            <li>確認空檔時間後，點選「加入 Google 行事曆」。</li>
                            <li>系統會開啟 Google 行事曆，請登入 Google 帳號後完成預約登記。</li>
                            <li>預約完成後，請確認活動已成功建立於 Google 行事曆中。</li>
                        </ol>
                        <!-- <p><strong>提醒：</strong>預約、修改及取消都必須在 Google 行事曆中操作。</p> -->
                        <img src="index.files/meetroom_sample.png" alt="會議室預約流程範例" class="sample-img">
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer>&copy; <span id="currentYear"></span> Microshift 台灣微轉</footer>

    <script>
        const rooms = [
            { id: "inter6", name: "Inter 6 Speed", calendarId: "0a43133f8f3c0d167ff1e2491d193b6bf67a6c782cb8e268b6a34f03ac28c41f@group.calendar.google.com" },
            { id: "inter12", name: "Inter 12 Speed", calendarId: "15a2eb874e570b0f82fea3d4e16792fe48ea75fcf7e8aa468d1444b662aac678@group.calendar.google.com" },
            { id: "speed8", name: "8 Speed", calendarId: "334b2ff7283c35a3c1f1e07d23d4395c1e12e9be5636e65c9bf1a86c36cc236c@group.calendar.google.com" },
            { id: "speed4", name: "4 Speed", calendarId: "d1c9ede0ead5821cc753b97e7c295a939cfac9f913adab9b422bce09110848e6@group.calendar.google.com" },
            { id: "speed15", name: "15 Speed", calendarId: "8c1694091a20fc60b74de84a22256488a7683ed353a9579669727ac442cb1603@group.calendar.google.com" },
            { id: "speed30", name: "30 Speed", calendarId: "79ae5ce5a4206ce00ae73e9f7f71f5f1571bb94535d4cd2e883292e6baf8e03a@group.calendar.google.com" },
            { id: "factory2", name: "二廠會議室", calendarId: "dbec68cc6f54bf7764aa998de4dc457f49f31f3476c5c3b46eb2f37fbe658a77@group.calendar.google.com" },
            { id: "visitor", name: "二廠訪客登記", calendarId: "62eaded99b7ed95902e257484a9ddced341d7d3e2a8040be0dccda929e82c6af@group.calendar.google.com" }
        ];

        const calendarUrl = room => `https://calendar.google.com/calendar/u/0?cid=${encodeURIComponent(room.calendarId)}`;
        const embedUrl = room => `https://calendar.google.com/calendar/embed?src=${encodeURIComponent(room.calendarId)}&ctz=Asia%2FTaipei`;
        const registrationLabel = "加入 Google 行事曆";

        function registrationLink(room) {
            return `<a class="btn-register" href="${calendarUrl(room)}" target="_blank" rel="noopener noreferrer">${registrationLabel}</a>`;
        }

        function calendarFrame(room, compact) {
            return `<div class="calendar-wrapper"${compact ? ' style="height:450px"' : ""}><iframe src="${embedUrl(room)}" title="${room.name} 行事曆" loading="lazy"></iframe></div>`;
        }

        function renderRooms() {
            const nav = document.getElementById("tabsNav");
            const panels = document.getElementById("tabPanels");
            nav.innerHTML = [
                { id: "info", name: "使用說明" },
                ...rooms.map(room => ({ id: room.id, name: room.name })),
                { id: "all", name: "全覽" }
            ].map((tab, index) =>
                `<button id="tab-${tab.id}" class="tab-btn${index === 0 ? " active" : ""}" role="tab" aria-selected="${index === 0}" aria-controls="${tab.id}" tabindex="${index === 0 ? "0" : "-1"}">${tab.name}</button>`
            ).join("");

            panels.insertAdjacentHTML("beforeend", rooms.map(room => `
                <section id="${room.id}" class="tab-content" role="tabpanel" aria-labelledby="tab-${room.id}">
                    <div class="room-card"><h2>${room.name}</h2>${registrationLink(room)}${calendarFrame(room, false)}</div>
                </section>
            `).join(""));

            panels.insertAdjacentHTML("beforeend", `
                <section id="all" class="tab-content" role="tabpanel" aria-labelledby="tab-all">
                    <div class="all-rooms-grid">${rooms.map(room => `
                        <div class="room-card"><h3>${room.name}</h3>${registrationLink(room)}${calendarFrame(room, true)}</div>
                    `).join("")}</div>
                </section>
            `);
        }

        function activateTab(tabId, focusButton) {
            document.querySelectorAll('[role="tab"]').forEach(tab => {
                const selected = tab.id === `tab-${tabId}`;
                tab.classList.toggle("active", selected);
                tab.setAttribute("aria-selected", selected);
                tab.tabIndex = selected ? 0 : -1;
            });
            document.querySelectorAll('[role="tabpanel"]').forEach(panel => {
                panel.classList.toggle("active", panel.id === tabId);
            });
            document.getElementById("mainContainer").classList.toggle("wide-mode", tabId === "all");
            if (focusButton) document.getElementById(`tab-${tabId}`).focus();
        }

        function updateDatetime() {
            const now = new Date();
            document.getElementById("currentDatetime").textContent = now.toLocaleString("zh-TW", {
                timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit",
                hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
            }) + "（台北時間）";
        }

        renderRooms();
        document.getElementById("tabsNav").addEventListener("click", event => {
            const tab = event.target.closest('[role="tab"]');
            if (tab) activateTab(tab.getAttribute("aria-controls"), false);
        });
        document.getElementById("tabsNav").addEventListener("keydown", event => {
            if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
            const tabs = [...document.querySelectorAll('[role="tab"]')];
            const current = tabs.indexOf(event.target);
            const next = event.key === "Home" ? 0 : event.key === "End" ? tabs.length - 1 :
                (current + (event.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
            event.preventDefault();
            activateTab(tabs[next].getAttribute("aria-controls"), true);
        });
        updateDatetime();
        setInterval(updateDatetime, 1000);
        document.getElementById("currentYear").textContent = new Date().getFullYear();
    </script>
</body>

</html>
